<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04051a">
<title>واژه‌باران</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--a1:#00e5ff;--a1r:0,229,255;--a2:#ff2bd6;--a2r:255,43,214;--bg:#04051a;--ink:#e9f4ff;--mut:#8ea3cc;--glass:rgba(12,18,48,.6);--bd:rgba(150,215,255,.2);--bad:#ff3d6e;--gold:#ffd24a;--ok:#46ffb0;--h:100dvh;--fd:'Lalezar','Vazirmatn',Tahoma,system-ui,sans-serif;--fb:'Vazirmatn',Tahoma,system-ui,sans-serif;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#04051a;color:var(--ink);font-family:var(--fb);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input{font-family:inherit}
#app{position:fixed;left:0;top:0;width:100%;height:var(--h);overflow:hidden;background:#04051a}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;transition:filter 1s}
#app.dead #cv{filter:blur(5px) saturate(.6) brightness(.65)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(2,3,14,.65) 100%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.03);filter:blur(8px);transition:opacity .45s,transform .45s,filter .45s,visibility 0s .45s;max-width:780px;margin:0 auto;width:100%}
.screen.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;transition-delay:0s}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--bd);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 10px 40px rgba(0,0,0,.4)}
.btn{font:600 16px var(--fb);color:var(--ink);cursor:pointer;border:1px solid rgba(var(--a1r),.55);background:linear-gradient(180deg,rgba(var(--a1r),.18),rgba(var(--a1r),.04));border-radius:14px;padding:12px 16px;box-shadow:0 0 16px rgba(var(--a1r),.22),inset 0 0 16px rgba(var(--a1r),.08);transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.big{font-size:23px;font-weight:800;padding:16px 20px;border-color:var(--a1);background:linear-gradient(100deg,rgba(var(--a1r),.5),rgba(var(--a2r),.45));box-shadow:0 0 26px rgba(var(--a1r),.45),0 0 60px rgba(var(--a2r),.25),inset 0 0 20px rgba(255,255,255,.12)}
.btn.alt{border-color:rgba(var(--a2r),.6);background:linear-gradient(180deg,rgba(var(--a2r),.2),rgba(var(--a2r),.04));box-shadow:0 0 16px rgba(var(--a2r),.2)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.ic{width:42px;height:42px;display:grid;place-items:center;font-size:18px;color:var(--ink);cursor:pointer;border-radius:13px;border:1px solid rgba(var(--a1r),.5);background:rgba(var(--a1r),.1);box-shadow:0 0 12px rgba(var(--a1r),.2);flex:none}
.ic:active{transform:scale(.92)}
.btn:focus-visible,.opt:focus-visible,.ic:focus-visible,.tg:focus-visible{outline:2px solid #fff;outline-offset:2px}
html[dir=rtl] .back{transform:scaleX(-1)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:600 14px var(--fb);color:var(--ink);cursor:pointer;padding:9px 13px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.04);transition:all .2s}
.opt.sel{border-color:var(--a1);background:rgba(var(--a1r),.2);box-shadow:0 0 14px rgba(var(--a1r),.35)}
.opt.lock{opacity:.45}
.seg.five{display:grid;grid-template-columns:repeat(5,1fr)}
.seg.five .opt{padding:9px 2px;font-size:12px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.seg.five .opt b{font-size:19px;font-weight:400}
.bar{display:flex;align-items:center;gap:10px}
.bar h2{margin:0;font:400 28px var(--fd);flex:1;text-shadow:0 0 14px rgba(var(--a1r),.6)}
.chip{padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;border:1px solid var(--bd);background:rgba(255,255,255,.05)}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sec{padding:14px}
.sec h3{margin:0 0 10px;font-size:15px;color:var(--mut);font-weight:600}
.hint{margin:10px 0 0;font-size:13px;color:var(--mut);line-height:1.7}
/* home */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:400 22px var(--fd);background:linear-gradient(135deg,var(--a1),var(--a2));color:#04051a;flex:none}
.who{flex:1;min-width:0}
.who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpb{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:6px;transition:width .6s}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.logo{font:400 clamp(60px,20vw,128px)/1.15 var(--fd);margin:0;text-align:center;background:linear-gradient(100deg,#fff 0%,var(--a1) 28%,var(--a2) 52%,#fff 66%,var(--a1) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(var(--a1r),.55)) drop-shadow(0 0 38px rgba(var(--a2r),.35));animation:sweep 5s linear infinite,intro 1.6s cubic-bezier(.2,.8,.2,1) both}
.tag{margin:0;font-size:14px;letter-spacing:.14em;color:var(--mut);animation:intro 1.6s .5s both}
.menu{display:flex;flex-direction:column;gap:12px;animation:up 1s .9s cubic-bezier(.2,.8,.2,1) both}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.credit{align-self:center;font-size:12px;color:var(--mut);padding:5px 14px;border-radius:999px;border:1px solid rgba(var(--a2r),.35);background:rgba(var(--a2r),.07);box-shadow:0 0 14px rgba(var(--a2r),.18);animation:up 1s 1.3s both}
.credit b{color:var(--a1);text-shadow:0 0 8px rgba(var(--a1r),.8);letter-spacing:.03em;font-family:Tahoma,sans-serif;direction:ltr;unicode-bidi:isolate}
@keyframes sweep{to{background-position:-250% 0}}
@keyframes intro{from{opacity:0;transform:scale(.8) translateY(-20px);letter-spacing:.3em}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px}
.row .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,.06);border:1px solid var(--bd);flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px}
.row .tx small{display:block;color:var(--mut);font-size:12px;margin-top:3px;line-height:1.5}
.prog{height:7px;border-radius:7px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--a1));border-radius:7px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{padding:12px;text-align:center}
.st b{display:block;font:400 26px var(--fd);color:var(--a1);text-shadow:0 0 12px rgba(var(--a1r),.6)}
.st small{color:var(--mut);font-size:12px}
.tg{width:54px;height:30px;border-radius:30px;border:1px solid var(--bd);background:rgba(255,255,255,.08);position:relative;cursor:pointer;flex:none;padding:0}
.tg::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#9bb0d8;transition:all .25s}
.tg.on{background:rgba(var(--a1r),.35);border-color:var(--a1)}
.tg.on::after{inset-inline-start:27px;background:var(--a1);box-shadow:0 0 10px var(--a1)}
.txt{width:100%;font:600 16px var(--fb);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;outline:none;-webkit-user-select:text;user-select:text}
.txt:focus{border-color:var(--a1)}
.lg{display:flex;align-items:center;gap:12px;padding:12px}
.lg .big{font-size:42px}
.lb{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;font-size:14px}
.lb.me{background:rgba(var(--a1r),.16);border:1px solid var(--a1)}
.lb span:first-child{width:26px;color:var(--mut);font-weight:800}
.lb span:nth-child(2){flex:1}
/* game */
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 4px;width:100%}
#hud .hl{display:flex;align-items:center;gap:8px}
#hud .hr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#stg{font-size:12px;color:var(--mut);line-height:1.4}
#score{font:400 38px/1 var(--fd);text-align:center;text-shadow:0 0 16px rgba(var(--a1r),.8);font-variant-numeric:tabular-nums;transition:transform .12s}
#score.pop{transform:scale(1.18)}
#combo{text-align:center;font-weight:800;font-size:15px;min-height:22px;color:var(--gold);text-shadow:0 0 10px rgba(255,150,40,.8)}
#lives{font-size:16px;letter-spacing:1px;direction:ltr;white-space:nowrap}
#lives .h{color:#ff4d8b;text-shadow:0 0 8px #ff4d8b}
#lives .h.x{opacity:.2;text-shadow:none}
#lives .tm{font-weight:800;font-size:18px;color:var(--a1)}
#ai{font-size:11px;color:var(--mut)}
#stage{flex:1;min-height:0}
#dock{width:100%;padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:8px}
.pw{display:flex;gap:10px;justify-content:center}
.pwb{position:relative;width:56px;height:46px;font-size:22px;border-radius:14px;cursor:pointer;color:var(--ink);border:1px solid var(--bd);background:rgba(10,16,44,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:0}
.pwb .n{position:absolute;top:-7px;inset-inline-end:-5px;font:800 11px var(--fb);background:var(--a2);color:#fff;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.pwb.act{border-color:var(--ok);box-shadow:0 0 16px var(--ok);animation:pulse 1s infinite}
.pwb.zero{opacity:.45}
@keyframes pulse{50%{box-shadow:0 0 6px var(--ok)}}
#inp{width:100%;font:800 22px var(--fb);text-align:center;color:#fff;caret-color:var(--a1);padding:12px 14px;border-radius:16px;border:1.5px solid rgba(var(--a1r),.7);background:rgba(8,12,40,.78);outline:none;box-shadow:0 0 18px rgba(var(--a1r),.35),inset 0 0 14px rgba(var(--a1r),.12);-webkit-user-select:text;user-select:text}
#inp::placeholder{color:#6f86b8;font-weight:600;font-size:16px}
#inp.bad{border-color:var(--bad);box-shadow:0 0 22px var(--bad);animation:nope .25s}
@keyframes nope{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#vk{display:flex;flex-direction:column;gap:5px;direction:rtl}
#vk[hidden]{display:none}
.vr{display:flex;gap:4px;justify-content:center}
.vk{flex:1;max-width:44px;height:40px;font:600 18px var(--fb);color:var(--ink);border-radius:9px;border:1px solid var(--bd);background:rgba(12,18,52,.8);cursor:pointer;padding:0}
.vk.w{max-width:90px}
.vk:active{background:rgba(var(--a1r),.4)}
#banner{position:absolute;top:24%;left:0;right:0;text-align:center;font:400 clamp(40px,12vw,68px) var(--fd);pointer-events:none;opacity:0;color:var(--a1);text-shadow:0 0 22px var(--a1),0 0 50px var(--a2)}
#banner.show{animation:ban 1.5s ease-out both}
#banner.fire{color:#ffb347;text-shadow:0 0 22px #ff6a00,0 0 50px #ff2200}
#banner.volt{color:#d9f6ff;text-shadow:0 0 22px #19b6ff,0 0 50px #7a5cff}
#banner.gold{color:var(--gold);text-shadow:0 0 24px #ff9d00}
@keyframes ban{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.1)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1.05)}}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);transform:translate(-50%,-10px);max-width:86%;padding:9px 16px;border-radius:14px;font-weight:600;font-size:14px;text-align:center;background:rgba(10,16,46,.85);border:1px solid rgba(var(--a1r),.6);box-shadow:0 0 18px rgba(var(--a1r),.35);opacity:0;pointer-events:none;transition:all .3s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(2,3,16,.55);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility 0s .35s;z-index:10}
.overlay.on{opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.screen:not(.on) .overlay,.screen:not(.on) .overlay.on{visibility:hidden;pointer-events:none}
.panel{width:100%;max-width:420px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.panel h2{margin:0;font:400 38px var(--fd);text-shadow:0 0 18px rgba(var(--a2r),.8)}
.panel .sc{font:400 64px/1 var(--fd);color:var(--a1);text-shadow:0 0 22px rgba(var(--a1r),.8)}
.rec{color:var(--gold);font-weight:800;text-shadow:0 0 12px #ff9d00;animation:pulse2 1s infinite}
@keyframes pulse2{50%{opacity:.5}}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rg div{padding:8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--bd);font-size:12px;color:var(--mut)}
.rg b{display:block;font-size:18px;color:var(--ink)}
.shk{animation:shk .5s}
@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.sp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
@media (prefers-reduced-motion:reduce){.logo,.tag,.menu,.credit{animation:none}.shk{animation:none}}
</style>
</head>
<body>
<div id="app">
<canvas id="cv"></canvas>
<div id="vig"></div>

<!-- HOME -->
<section class="screen on" id="s-home">
  <div class="topbar glass">
    <div class="av" id="hAv">؟</div>
    <div class="who"><b id="hName"></b><small id="hLv" style="color:var(--mut)"></small><div class="xpb"><i id="hXp"></i></div></div>
    <div class="chip" id="hCoins">🪙 0</div>
  </div>
  <div class="hero">
    <h1 class="logo">واژه‌باران</h1>
    <p class="tag" data-i="theme"></p>
  </div>
  <div class="menu">
    <button class="btn big" id="bPlay" data-i="play"></button>
    <div class="grid2">
      <button class="btn" data-go="shop">🛒 <span data-i="shop"></span></button>
      <button class="btn" data-go="missions">📅 <span data-i="missions"></span></button>
      <button class="btn" data-go="profile">👤 <span data-i="profile"></span></button>
      <button class="btn" data-go="lexicon">🎓 <span data-i="lexicon"></span></button>
    </div>
    <button class="btn alt sm" data-go="settings">⚙️ <span data-i="settings"></span></button>
  </div>
  <div class="credit"><span data-i="by"></span> <b>@M_H_2000o</b></div>
</section>

<!-- SETUP -->
<section class="screen" id="s-setup">
  <div class="bar"><button class="ic back" data-go="home" aria-label="back">←</button><h2 data-i="setup"></h2></div>
  <div class="scroll">
    <div class="glass sec"><h3 data-i="mode"></h3><div class="seg" id="gMode"></div><p class="hint" id="modeDesc"></p></div>
    <div class="glass sec"><h3 data-i="world"></h3><div class="seg" id="gWorld"></div></div>
    <div class="glass sec"><h3 data-i="diff"></h3><div class="seg" id="gDiff"></div></div>
    <div class="glass sec"><h3 data-i="speed"></h3><div class="seg five" id="gSpeed"></div></div>
  </div>
  <button class="btn big" id="bStart" data-i="start"></button>
</section>

<!-- SHOP -->
<section class="screen" id="s-shop">
  <div class="bar"><button class="ic back" data-go="home" aria-label="back">←</button><h2 data-i="shop"></h2><div class="chip" id="shopCoins"></div></div>
  <div class="seg" id="shopTabs"></div>
  <div class="scroll"><div class="list" id="shopList"></div></div>
</section>

<!-- MISSIONS -->
<section class="screen" id="s-missions">
  <div class="bar"><button class="ic back" data-go="home" aria-label="back">←</button><h2 data-i="missions"></h2></div>
  <p class="hint" style="margin:0" data-i="daily"></p>
  <div class="scroll"><div class="list" id="mList"></div></div>
</section>

<!-- PROFILE -->
<section class="screen" id="s-profile">
  <div class="bar"><button class="ic back" data-go="home" aria-label="back">←</button><h2 data-i="profile"></h2></div>
  <div class="scroll">
    <div class="glass lg"><div class="big" id="pLg"></div><div style="flex:1"><b id="pLgN" style="font-size:18px"></b><div style="color:var(--mut);font-size:13px" id="pLv"></div><div class="xpb"><i id="pXp"></i></div></div></div>
    <div class="glass sec"><h3 data-i="edit"></h3>
      <input class="txt" id="nameIn" maxlength="14" autocomplete="off">
      <h3 style="margin-top:14px" data-i="avatar"></h3><div class="seg" id="gAv"></div>
      <h3 style="margin-top:14px" data-i="nick"></h3>
      <input class="txt" id="nickIn" maxlength="18" autocomplete="off">
      <div class="seg" id="gNick" style="margin-top:8px"></div></div>
    <div class="stats" id="pStats"></div>
  </div>
</section>

<!-- LEXICON -->
<section class="screen" id="s-lexicon">
  <div class="bar"><button class="ic back" data-go="home" aria-label="back">←</button><h2 data-i="lexicon"></h2><div class="chip" id="lxCount"></div></div>
  <div class="seg" id="lxTabs"></div>
  <div class="glass sec" style="text-align:center"><div id="fcW" style="font:400 54px var(--fd);color:var(--a1);text-shadow:0 0 18px rgba(var(--a1r),.7)"></div><div id="fcM" style="color:var(--mut);margin:4px 0 12px"></div>
    <div class="row2"><button class="btn sm" id="fcKnow" data-i="know"></button><button class="btn sm alt" id="fcNext" data-i="nextw"></button></div></div>
  <button class="btn" id="bPractice" data-i="practice"></button>
  <div class="scroll"><div class="list" id="lxList" style="gap:8px"></div></div>
</section>

<!-- SETTINGS -->
<section class="screen" id="s-settings">
  <div class="bar"><button class="ic back" data-go="home" aria-label="back">←</button><h2 data-i="settings"></h2></div>
  <div class="scroll">
    <div class="glass sec"><h3 data-i="lang"></h3><div class="seg" id="gLang"></div></div>
    <div class="glass sec">
      <div class="sp"><span data-i="sound"></span><button class="tg" id="tgSnd" aria-label="sound"></button></div>
      <div class="sp"><span data-i="vib"></span><button class="tg" id="tgVib" aria-label="vibration"></button></div>
      <div class="sp"><span data-i="vkb"></span><button class="tg" id="tgVkb" aria-label="keyboard"></button></div>
      <div class="sp"><span data-i="lowfx"></span><button class="tg" id="tgLow" aria-label="low effects"></button></div>
    </div>
    <div class="glass sec" style="text-align:center">
      <div class="logo" style="font-size:44px;animation:sweep 5s linear infinite">واژه‌باران</div>
      <p class="hint" data-i="about"></p>
      <div class="credit" style="display:inline-block;animation:none"><span data-i="by"></span> <b>@M_H_2000o</b></div>
    </div>
    <button class="btn sm" id="bReset"></button>
  </div>
</section>

<!-- GAME -->
<section class="screen" id="s-game" style="padding:0;gap:0">
  <div id="hud">
    <div class="hl"><button class="ic" id="bPause" aria-label="pause">❚❚</button><div id="stg"></div></div>
    <div class="hc"><div id="score">0</div><div id="combo"></div></div>
    <div class="hr"><div id="lives"></div><div id="ai"></div></div>
  </div>
  <div id="stage"></div>
  <div id="dock">
    <div class="pw" id="pw"></div>

function tone(f,d,type='sine',v=.1,slide=0,delay=0){if(!S.sound)return;const ac=audio();if(!ac)return;try{const t0=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+.03)}catch(e){}}
const PACK={classic:{w:'sine',w2:'triangle',m:1},retro:{w:'square',w2:'square',m:.7},crystal:{w:'sine',w2:'sine',m:1.6}};
function sfx(k,c=0){const p=PACK[S.eq.snd]||PACK.classic,m=p.m;switch(k){
case'tick':tone(620*m,.05,p.w,.045);break;
case'kill':tone((520+Math.min(c,30)*8)*m,.09,p.w,.1,300*m);tone(780*m,.14,p.w2,.07,500*m,.05);break;
case'bad':tone(150,.16,'sawtooth',.07,-70);break;
case'miss':tone(180,.35,'sawtooth',.13,-110);tone(90,.4,'square',.07,-30,.05);break;
case'combo':[0,1,2].forEach(i=>tone((520+i*180)*m,.12,p.w2,.08,0,i*.07));break;
case'power':tone(300*m,.3,p.w,.1,900*m);break;
case'coin':tone(988*m,.07,p.w2,.08);tone(1318*m,.18,p.w2,.08,0,.07);break;
case'over':[400,330,260,180].forEach((f,i)=>tone(f,.28,'sawtooth',.08,-40,i*.18));break;
case'up':[523,659,784,1046].forEach((f,i)=>tone(f,.16,p.w2,.08,0,i*.09));break;
case'click':tone(440*m,.04,p.w,.04);break}}

function mk(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w*DPR);c.height=Math.ceil(h*DPR);const x=c.getContext('2d');x.scale(DPR,DPR);c.cw=w;c.ch=h;return[c,x]}
function rr(c,x,y,w,h,r){r=Math.min(r,h/2,w/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

if(ring){x.strokeStyle='rgba(255,230,200,.55)';x.lineWidth=r*.16;x.beginPath();x.ellipse(cx,cy,r*1.5,r*.45,-.35,Math.PI,Math.PI*2);x.stroke()}
const g=x.createRadialGradient(cx-r*.35,cy-r*.35,r*.1,cx,cy,r);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();

const sh=x.createRadialGradient(cx+r*.5,cy+r*.4,r*.2,cx,cy,r*1.05);sh.addColorStop(0,'rgba(0,0,20,0)');sh.addColorStop(1,'rgba(0,0,20,.7)');x.fillStyle=sh;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();return c}

ctx.font=`800 ${FS}px Vazirmatn,Tahoma,sans-serif`;ctx.direction='rtl';const wd=ctx.measureText(o.w).width,half=wd/2+22;const x0=OX+half+4,x1=OX+PW-half-4;let bx=OX+PW/2;

function adaptPush(ok,p){const g=G;g.hist.push({ok,p});if(g.hist.length>14)g.hist.shift();const n=g.hist.length;if(n<4)return;const acc=g.hist.reduce((s,h)=>s+h.ok,0)/n,oks=g.hist.filter(h=>h.ok),avg=oks.reduce((s,h)=>s+h.p,0)/Math.max(1,oks.length);g.adapt+=(clamp(1+(acc-.8)*1.1+(.45-avg)*.9,.7,1.4)-g.adapt)*.2}
function kill(w,by){const g=G,i=g.words.indexOf(w);if(i<0)return;g.words.splice(i,1);if(g.target===w){g.target=null;g.typed=0}
const y=wy(w.p),typed=by==='type';
if(typed){g.combo++;g.kills++;if(g.combo>g.maxCombo)g.maxCombo=g.combo;adaptPush(1,clamp(w.p,0,1))}
const mult=1+(g.pw.energy>0?1:0)+(g.pw.x3>0?2:0);
let pts=Math.round(w.len*10*DS[g.cfg.diff]*SS[g.cfg.speed]*(.9+w.len*.04)*(1+Math.min(g.combo,50)*.04)*(1.5-clamp(w.p,0,1)*.5)*(w.type==='gold'?3:1)*mult);if(!typed)pts=Math.round(pts*.5);

burst(w.x,y,w);floatTxt(w.x,y-20,'+'+pts,w.type==='gold'?'#ffd24a':'#fff');sfx('kill',g.combo);

if(w.type==='gold'){g.coins+=3;g.golds++;banner(t('b_gold'),'gold');floatTxt(w.x,y-48,'🪙 +3','#ffd24a',18);sfx('coin')}
if(w.type==='gift'){const r=Math.random();if(r<.55){const n=ri(8,25);g.coins+=n;toast('🎁 '+t('g_coin',{n}))}else if(r<.72&&g.lives<g.maxLives+(g.mode==='endless'?2:0)){g.lives++;toast('🎁 '+t('g_life'))}else{const p=pick(POW);S.inv[p]++;save();toast('🎁 '+t('g_power',{n:POWE[p]+' '+t('p_'+p)}))}sfx('coin')}
if(w.type==='energy'){const r=Math.random();if(r<.34){g.pw.slow=6;toast('⚡ '+t('e_slow'))}else if(r<.67){g.pw.x3=8;toast('⚡ '+t('e_x3'))}else{toast('⚡ '+t('e_clear'));setTimeout(()=>{if(G===g&&state==='play')thunder(99,true)},60)}sfx('power')}
if(typed)comboFx();hud(true)}
function comboFx(){const g=G,c=g.combo;if(c===10){banner(t('b_fire'),'fire');sfx('combo')}else if(c===25){banner(t('b_volt'),'volt');sfx('combo')}else if(c>0&&c%50===0){banner(t('b_special'),'volt');sfx('combo');g.coins+=5;thunder(5,true)}}

else{if(g.mode==='timed')g.score=Math.max(0,g.score-30);else g.lives--;g.flash=1;g.shake=.6;sfx('miss');vibe([60,40,60]);floatTxt(w.x,FB-24,'✗','#ff3d6e',30)}
hud(true);if(g.lives<=0)endRun('dead')}

if(rs&&v.length>1){inp.value=c;prevLen=1;g.target=rs;g.typed=1}else{clearInput()}}}

/* ---------- Update & render ---------- */
function update(dt){T+=dt;const tt=Math.sin(T*.18)*.7+ptr*.5;tilt+=(tt-tilt)*Math.min(1,dt*2);if(state==='play')stepGame(dt);
if(G&&(state==='play'||state==='over'||state==='pause')){const g=G;if(state!=='pause'){for(let i=g.parts.length-1;i>=0;i--){const p=g.parts[i];if(p.d>0){p.d-=dt;continue}p.l-=dt;if(p.l<=0){g.parts[i]=g.parts[g.parts.length-1];g.parts.pop();continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.r+=p.vr*dt}
for(let i=g.floats.length-1;i>=0;i--){const f=g.floats[i];f.l-=dt*1.1;f.y-=40*dt;if(f.l<=0)g.floats.splice(i,1)}for(let i=g.ghosts.length-1;i>=0;i--){g.ghosts[i].l-=dt;if(g.ghosts[i].l<=0)g.ghosts.splice(i,1)}for(let i=g.bolts.length-1;i>=0;i--){g.bolts[i].l-=dt;if(g.bolts[i].l<=0)g.bolts.splice(i,1)}}}}
function shape(c,wd,hh,k){c.beginPath();const x=-wd/2,y=-hh/2;if(k==='hex'){const e=hh*.5;c.moveTo(x,0);c.lineTo(x+e,y);c.lineTo(x+wd-e,y);c.lineTo(x+wd,0);c.lineTo(x+wd-e,y+hh);c.lineTo(x+e,y+hh);c.closePath()}else{rr(c,x,y,wd,hh,hh/2);if(k==='drop'){c.moveTo(-9,y+1);c.lineTo(0,y-11);c.lineTo(9,y+1)}}}
function drawWord(w){const g=G,y=wy(w.p),d=.84+.26*clamp(w.p,0,1),hh=FS*1.75,wd=w.wd+34,isT=g.target===w;
const col=w.type==='gold'?'255,210,74':w.type==='gift'?'255,90,200':w.type==='energy'?'70,255,176':C1,dg=w.p>.78,sc=dg?'255,61,110':col;
ctx.save();ctx.translate(w.x+Math.sin(T*1.6+w.wob)*2.5*d,y);ctx.scale(d,d);shape(ctx,wd,hh,S.eq.shape);ctx.fillStyle=`rgba(8,12,38,${isT?.88:.74})`;ctx.fill();
if(!LOW()){ctx.shadowColor=`rgba(${sc},.9)`;ctx.shadowBlur=isT?24:12}ctx.lineWidth=isT?2.6:1.6;ctx.strokeStyle=`rgba(${sc},${isT?1:.8})`;ctx.stroke();ctx.shadowBlur=0;
ctx.font=`800 ${FS}px Vazirmatn,Tahoma,sans-serif`;ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=w.type==='gold'?'#ffeaa6':'#eaf6ff';ctx.fillText(w.w,0,2);
if(isT&&g.typed>0){const pw=ctx.measureText(w.w.slice(0,g.typed)).width;ctx.save();ctx.beginPath();ctx.rect(w.wd/2-pw-1,-hh,pw+2,hh*2);ctx.clip();ctx.fillStyle=`rgb(${col})`;ctx.fillText(w.w,0,2);ctx.restore()}
if(w.type!=='n'){ctx.font=`${Math.round(FS*.8)}px sans-serif`;ctx.direction='ltr';ctx.fillText(w.type==='gold'?'★':w.type==='gift'?'🎁':'⚡',wd/2-4,-hh/2+2)}
if(g.mode==='learn'){ctx.font=`600 ${Math.round(FS*.5)}px Vazirmatn,Tahoma,sans-serif`;ctx.direction='ltr';ctx.fillStyle='rgba(200,230,255,.75)';ctx.fillText(L==='es'?w.o.es:w.o.en,0,hh/2+FS*.45)}
ctx.restore()}
function drawBolt(b){const a=clamp(b.l/.22,0,1);ctx.save();ctx.lineJoin='round';for(const[lw,c]of[[7,`rgba(${C1},${.35*a})`],[3,`rgba(255,255,255,${a})`]]){ctx.lineWidth=lw;ctx.strokeStyle=c;ctx.beginPath();b.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}ctx.restore()}
function drawGame(){const g=G;
// danger zone
const lw=g.words.reduce((m,w)=>Math.max(m,w.p),0),pul=.55+.45*Math.sin(T*6)*clamp((lw-.6)*3,0,1),gr=ctx.createLinearGradient(0,FB-80,0,FB);gr.addColorStop(0,'rgba(255,61,110,0)');gr.addColorStop(1,`rgba(255,61,110,${.12+.2*clamp(lw,0,1)*pul})`);ctx.fillStyle=gr;ctx.fillRect(0,FB-80,W,80);
ctx.fillStyle='rgba(2,3,16,.5)';ctx.fillRect(0,FB,W,H-FB);ctx.save();ctx.setLineDash([12,8]);ctx.lineDashOffset=-T*30;ctx.lineWidth=2;ctx.strokeStyle=`rgba(255,61,110,${.55+.4*pul})`;if(!LOW()){ctx.shadowColor='#ff3d6e';ctx.shadowBlur=12}ctx.beginPath();ctx.moveTo(0,FB);ctx.lineTo(W,FB);ctx.stroke();ctx.restore();
ctx.save();ctx.globalCompositeOperation='lighter';for(const p of g.parts)if(p.k==='g'&&p.d!==0||p.k==='g'){const a=clamp(p.l/p.m,0,1),s=p.s*(p.vy<-80&&p.g===0?a:.4+a*.6);ctx.globalAlpha=a;ctx.drawImage(glow(p.c),p.x-s/2,p.y-s/2,s,s)}ctx.restore();ctx.globalAlpha=1;
for(const w of [...g.words].sort((a,b)=>a.p-b.p))drawWord(w);
for(const gh of g.ghosts){const a=gh.l/.7,sc=1+(1-a)*.6;ctx.save();ctx.translate(gh.x,gh.y);ctx.scale(sc,sc);ctx.globalAlpha=a*.7;ctx.font=`800 ${FS}px Vazirmatn,Tahoma,sans-serif`;ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=`rgb(${C1})`;ctx.fillText(gh.w,0,0);if(!LOW()){ctx.fillStyle='rgba(4,6,30,.55)';for(let yy=-FS;yy<FS;yy+=4)ctx.fillRect(-FS*3,yy,FS*6,1.5)}ctx.restore()}
ctx.globalAlpha=1;
for(const p of g.parts){if(p.k==='g'||p.d>0)continue;const a=clamp(p.l/p.m,0,1);ctx.globalAlpha=a;if(p.k==='rg'){ctx.strokeStyle=`rgb(${p.c})`;ctx.lineWidth=3*a+1;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1-a),0,7);ctx.stroke()}
else if(p.k==='sq'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=`rgb(${p.c})`;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);ctx.restore()}
else if(p.k==='st'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=`rgb(${p.c})`;const s=p.s*.5*a;ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.28,-s*.28);ctx.lineTo(s,0);ctx.lineTo(s*.28,s*.28);ctx.lineTo(0,s);ctx.lineTo(-s*.28,s*.28);ctx.lineTo(-s,0);ctx.lineTo(-s*.28,-s*.28);ctx.fill();ctx.restore()}
else if(p.k==='ch'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*.3);ctx.font=`800 ${p.s}px Vazirmatn,Tahoma,sans-serif`;ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=`rgb(${p.c})`;ctx.fillText(p.ch,0,0);ctx.restore()}}
ctx.globalAlpha=1;for(const b of g.bolts)drawBolt(b);
ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='ltr';for(const f of g.floats){ctx.globalAlpha=clamp(f.l,0,1);ctx.font=`800 ${f.sz}px Vazirmatn,Tahoma,sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,20,.7)';ctx.strokeText(f.s,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.s,f.x,f.y)}ctx.globalAlpha=1;
if(g.flash>0){ctx.fillStyle=g.combo>=25?`rgba(180,230,255,${g.flash*.25})`:`rgba(255,40,90,${g.flash*.28})`;ctx.fillRect(0,0,W,H)}}
function render(){const playing=state==='play'||state==='pause'||state==='over',sid=playing?G.world:'city';ctx.save();
if(playing&&G.shake>0&&!RM){const s=G.shake*12;ctx.translate(rnd(-s,s),rnd(-s,s))}
drawScene(sid);if(playing){bgFx(true);drawGame()}ctx.restore()}
let last=0;function frame(ts){requestAnimationFrame(frame);if(!last){last=ts;return}let dt=(ts-last)/1000;last=ts;if(dt>.25)dt=.016;if(dt>.034){if(++slowF>100&&!autoLow){autoLow=true;initDyn();initAmb()}}else if(slowF>0)slowF-=.5;DT=Math.min(dt,.05);
if(state==='pause'){render();return}update(DT);render()}

/* ---------- UI: screens ---------- */
let cur='home';
function go(id,silent){$$('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+id));cur=id;if(!silent)sfx('click');
if(id!=='game')$$('.overlay').forEach(o=>o.classList.remove('on'));
if(id!=='game'&&(state==='play'||state==='pause'||state==='over')){state='menu';app.classList.remove('dead')}
({home:renderHome,setup:renderSetup,shop:renderShop,missions:renderMissions,profile:renderProfile,lexicon:renderLexicon,settings:renderSettings})[id]?.();
if(id!=='game')document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
function seg(el,items,sel,onSel){el.innerHTML='';items.forEach((it,i)=>{const b=document.createElement('button');b.className='opt'+(i===sel?' sel':'')+(it.lock?' lock':'');b.innerHTML=it.html;b.addEventListener('click',()=>{if(it.lock){sfx('bad');toast(it.lock);return}sfx('click');onSel(i)});el.appendChild(b)})}
function renderTop(){const un=S.name||t('you');$('#hAv').textContent=S.av;$('#hName').textContent=un+'  '+LG[league(S.lv)];$('#hLv').textContent=(S.title?S.title+' · ':'')+t('lvl',{n:S.lv});$('#hXp').style.width=(S.xp/need(S.lv)*100)+'%';$('#hCoins').textContent='🪙 '+S.coins}
function renderHome(){renderTop();initAmb()}
function renderSetup(){const c=S.cfg;
seg($('#gMode'),MODES.map(m=>({html:t('m_'+m)})),MODES.indexOf(c.mode),i=>{c.mode=MODES[i];save();renderSetup()});$('#modeDesc').textContent=t('md_'+c.mode);
seg($('#gWorld'),[{html:t('w_auto')},...WIDS.map((w,i)=>({html:t('w_'+w)+(S.lv<UNL[i]?' 🔒':''),lock:S.lv<UNL[i]?t('lock',{n:UNL[i]}):null}))],c.world,i=>{c.world=i;save();renderSetup()});
seg($('#gDiff'),['d_easy','d_mid','d_hard'].map(k=>({html:t(k)})),c.diff,i=>{c.diff=i;save();renderSetup()});
seg($('#gSpeed'),['🐢','🚶','🏃','⚡','🔥'].map((e,i)=>({html:`<b>${e}</b>${t('s'+(i+1))}`})),c.speed,i=>{c.speed=i;save();renderSetup()})}
let shopTab='items';
function card(par,{ico,title,sub,btn,cls,fn,dis,bg}){const d=document.createElement('div');d.className='glass row';d.innerHTML=`<div class="ico"${bg?` style="background:${bg}"`:''}>${ico}</div><div class="tx"><b>${title}</b><small>${sub||''}</small></div>`;const b=document.createElement('button');b.className='btn sm '+(cls||'');b.textContent=btn;b.disabled=!!dis;b.addEventListener('click',fn);d.appendChild(b);par.appendChild(d)}
function renderShop(){$('#shopCoins').textContent='🪙 '+S.coins;const tabs=['items','skin','bg','fx','shape','snd'];seg($('#shopTabs'),tabs.map(k=>({html:t('t_'+k)})),tabs.indexOf(shopTab),i=>{shopTab=tabs[i];renderShop()});
const box=$('#shopList');box.innerHTML='';
if(shopTab==='items'){ITEMS.forEach(it=>{const pw=POW.includes(it.id);card(box,{ico:it.e,title:pw?t('p_'+it.id):t('it_'+it.id),sub:(pw?t('pd_'+it.id)+' · '+t('have',{n:S.inv[it.id]}):t('it_'+it.id+'D')+(it.id==='lifeBoost'&&S.lifeBoost?' · '+t('have',{n:S.lifeBoost}):it.id==='xpBoost'&&S.boost?' · '+t('have',{n:S.boost}):'')),btn:'🪙 '+it.p,fn:()=>{if(S.coins<it.p){sfx('bad');toast(t('nocoins'));return}S.coins-=it.p;if(pw)S.inv[it.id]++;else if(it.id==='lifeBoost')S.lifeBoost++;else if(it.id==='xpBoost')S.boost+=3;else POW.forEach(p=>S.inv[p]++);save();sfx('coin');toast(t('bought'));renderShop()}})})}
else CAT[shopTab].forEach(c=>{const own=S.own[shopTab].includes(c.id),eq=S.eq[shopTab]===c.id;card(box,{ico:c.e||'',bg:c.c?`linear-gradient(135deg,${c.c[0]},${c.c[1]})`:'',title:c.n[LI[L]],sub:own?'':'🪙 '+c.p,btn:eq?t('equipped'):own?t('equip'):'🪙 '+c.p,cls:eq?'alt':'',dis:eq,fn:()=>{if(!own){if(S.coins<c.p){sfx('bad');toast(t('nocoins'));return}S.coins-=c.p;S.own[shopTab].push(c.id);sfx('coin')}S.eq[shopTab]=c.id;if(shopTab==='skin')applySkin();save();renderShop()}})})}
function renderMissions(){ensureDaily();const box=$('#mList');box.innerHTML='';S.daily.list.forEach((m,i)=>{const done=m.prog>=m.target,pct=clamp(m.prog/m.target,0,1)*100;const d=document.createElement('div');d.className='glass row';
d.innerHTML=`<div class="ico">${{words:'⌨️',combo:'🔥',time:'⏱'}[m.type]}</div><div class="tx"><b>${t('mq_'+m.type,{n:m.target})}</b><small>🪙 ${m.coins} · ✨ ${m.xp}${m.tier===2?' · 🎁':''}</small><div class="prog"><i style="width:${pct}%"></i></div></div>`;
const b=document.createElement('button');b.className='btn sm';b.textContent=m.got?t('claimed'):t('claim');b.disabled=!done||m.got;b.addEventListener('click',()=>{m.got=true;S.coins+=m.coins;const u=addXp(m.xp);if(m.tier===2)S.inv[pick(POW)]++;save();sfx(u?'up':'coin');if(u)toast(t('lvup',{n:S.lv}));renderMissions();renderTop()});d.appendChild(b);box.appendChild(d)})}
function renderProfile(){const lg=league(S.lv);$('#pLg').textContent=S.av;$('#pLgN').textContent=(S.name||t('you'))+' '+LG[lg];$('#nameIn').value=S.name;$('#nameIn').placeholder=t('you');$('#nickIn').value=S.title;$('#nickIn').placeholder=t('nick');
seg($('#gAv'),AVS.map(a=>({html:a})),AVS.indexOf(S.av),i=>{S.av=AVS[i];save();renderProfile()});
seg($('#gNick'),NICKS.map(n=>({html:n[LI[L]]})),-1,i=>{S.title=NICKS[i][LI[L]];save();renderProfile()});
$('#pLv').textContent=(S.title?S.title+' · ':'')+t('lvl',{n:S.lv})+'  ·  '+S.xp+'/'+need(S.lv)+' XP';$('#pXp').style.width=(S.xp/need(S.lv)*100)+'%';
const st=S.stats,mins=Math.floor(st.secs/60),acc=st.keys?Math.round((st.keys-st.wrong)/st.keys*100)+'%':'—';
$('#pStats').innerHTML=[[t('st_words'),fmt(st.words)],[t('st_best'),fmt(st.best)],[t('st_wpm'),st.wpm||'—'],[t('st_combo'),st.combo],[t('st_acc'),acc],[t('st_time'),mins+'′'],[t('st_learned'),Object.keys(S.learned).length]].map(([a,b])=>`<div class="glass st"><b>${b}</b><small>${a}</small></div>`).join('');
}
let lxTab=0,fcI=0;
function renderLexicon(){const lrn=S.learned,list=WD[WIDS[lxTab]];$('#lxCount').textContent=`${Object.keys(lrn).length}/${ALLW.length}`;seg($('#lxTabs'),WIDS.map(w=>({html:t('w_'+w)})),lxTab,i=>{lxTab=i;fcI=0;renderLexicon()});
const un=list.filter(o=>!lrn[o.n]),o=un.length?un[fcI%un.length]:null;$('#fcW').textContent=o?o.w:'🎉';$('#fcM').textContent=o?(L==='es'?o.es:o.en):t('fcDone');$('#fcKnow').disabled=$('#fcNext').disabled=!o;
$('#lxList').innerHTML=list.map(o=>{const k=!!lrn[o.n];return`<div class="glass row" style="padding:10px 14px"><div class="tx"><b style="font-size:18px">${o.w}</b></div><span style="color:var(--mut);font-size:14px">${L==='es'?o.es:o.en} ${k?'✓':''}</span></div>`}).join('')}
$('#fcKnow').addEventListener('click',()=>{const list=WD[WIDS[lxTab]],un=list.filter(o=>!S.learned[o.n]);if(!un.length)return;S.learned[un[fcI%un.length].n]=1;save();sfx('coin');renderLexicon()});
$('#fcNext').addEventListener('click',()=>{fcI++;sfx('click');renderLexicon()});
$('#bPractice').addEventListener('click',()=>{S.cfg.mode='learn';S.cfg.world=S.lv>=UNL[lxTab]?lxTab+1:0;save();go('setup')});
function renderSettings(){seg($('#gLang'),[{html:'🇮🇷 فارسی'},{html:'🇺🇸 English'},{html:'🇪🇸 Español'}],LI[L],i=>{L=['fa','en','es'][i];S.lang=L;save();applyLang();renderSettings()});
[['#tgSnd','sound'],['#tgVib','vib'],['#tgVkb','vkb'],['#tgLow','low']].forEach(([s,k])=>$(s).classList.toggle('on',!!S[k]));$('#bReset').textContent=t('reset')}
$('#nameIn').addEventListener('input',e=>{S.name=e.target.value.trim();save()});
$('#nickIn').addEventListener('input',e=>{S.title=e.target.value.trim();save()});
const AVS=['🦊','🐺','🐱','🦉','🐲','🤖','👾','🧙','🥷','🧑‍🚀','🦄','🐬'];
const NICKS=[['شکارچی واژه','Word hunter','Cazapalabras'],['تایپیست نئونی','Neon typist','Mecanógrafo neón'],['برق‌آسا','Lightning hands','Manos de rayo'],['استاد باران','Rain master','Maestro de la lluvia'],['ستاره‌ی کهکشان','Galaxy star','Estrella galáctica']];
[['#tgSnd','sound'],['#tgVib','vib'],['#tgVkb','vkb'],['#tgLow','low']].forEach(([s,k])=>$(s).addEventListener('click',()=>{S[k]=!S[k];save();$(s).classList.toggle('on',S[k]);if(k==='low'){initDyn();initAmb()}if(k==='sound'&&S.sound)sfx('click');else if(k==='vib')vibe(40)}));
let rsT=0;$('#bReset').addEventListener('click',e=>{if(!rsT){e.target.textContent=t('reset2');rsT=setTimeout(()=>{rsT=0;e.target.textContent=t('reset')},3000)}else{clearTimeout(rsT);rsT=0;try{localStorage.removeItem(KEY)}catch(x){}load();applySkin();applyLang();ensureDaily();go('home')}});
function applyLang(){const h=document.documentElement;h.lang=L;h.dir=L==='fa'?'rtl':'ltr';$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));inp.placeholder=t('ph');document.title=L==='fa'?'واژه‌باران':'Vazhebaran';renderTop();if(G&&state==='play')hud(false)}

/* ---------- Wiring ---------- */
$('#bPlay').addEventListener('click',()=>{audio();go('setup')});
$('#bStart').addEventListener('click',()=>{audio();startGame()});
const hold=(el,fn)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();fn()});el.addEventListener('click',e=>{if(e.detail===0)fn()})};
hold($('#bPause'),pauseGame);
$('#bResume').addEventListener('click',()=>{sfx('click');resumeGame()});
$('#bRestart').addEventListener('click',()=>{sfx('click');if(G&&!G.ended)endRun('quit');startGame()});
$('#bQuit').addEventListener('click',()=>{if(G&&!G.ended)endRun('quit');else go('home')});
$('#bAgain').addEventListener('click',()=>{sfx('click');startGame()});
$('#bHome').addEventListener('click',()=>{go('home')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame()});

/* ---------- Init ---------- */
load();applySkin();ensureDaily();buildVK();applyLang();resize();initAmb();
try{Promise.all([document.fonts.load('800 22px Vazirmatn','آب واژه'),document.fonts.load('400 40px Lalezar','واژه‌باران')]).then(()=>{sceneCache.clear()}).catch(()=>{})}catch(e){}
requestAnimationFrame(frame);
</script>
